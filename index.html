<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#E12717">
  <meta name="description" content="GREAZ — Not Your Usual Burger. سماش برجر، راب، مقبلات ومشروبات في بيروت. اطلب عبر واتساب. Smash burgers, wraps & appetizers in Beirut. Order via WhatsApp.">
  <title>GREAZ | Not Your Usual Burger — بيروت</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23E12717'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial Black, Arial' font-weight='900' font-style='italic' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ======= Header ======= -->
  <header id="header">
    <div class="container header-inner">
      <a href="#top" class="brand" aria-label="GREAZ">
        <span class="brand-logo">G</span>
        <span class="brand-text">GREAZ<em>★</em></span>
      </a>

      <nav class="nav" id="nav" aria-label="Main">
        <a href="#menu" data-i18n="nav.menu"></a>
        <a href="#about" data-i18n="nav.about"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
      </nav>

      <div class="header-actions">
        <button class="lang-btn" id="langBtn" aria-label="Switch language">EN</button>
        <button class="cart-btn" id="cartBtn" aria-label="Cart">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
        <button class="burger-btn" id="navToggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile nav panel -->
  <div class="mobile-nav" id="mobileNav">
    <a href="#menu" data-i18n="nav.menu"></a>
    <a href="#about" data-i18n="nav.about"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
  </div>

  <main id="top">

    <!-- ======= Hero ======= -->
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-text reveal">
          <span class="eyebrow" data-i18n="hero.eyebrow"></span>
          <h1 class="display" data-i18n-html="hero.title"></h1>
          <p class="hero-sub" data-i18n="hero.sub"></p>
          <div class="hero-cta">
            <a href="#menu" class="btn btn-primary btn-lg" data-i18n="hero.order"></a>
            <a id="heroWa" class="btn btn-wa btn-lg" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
              <span data-i18n="hero.wa"></span>
            </a>
          </div>
          <ul class="hero-badges">
            <li data-i18n="hero.badge1"></li>
            <li data-i18n="hero.badge2"></li>
            <li data-i18n="hero.badge3"></li>
          </ul>
        </div>
        <div class="hero-img reveal">
          <div class="hero-frame">
            <img src="assets/img/hero-burger.jpg" alt="GREAZ Smash Burger" loading="eager">
          </div>
          <div class="price-sticker"><b>$5</b><span data-i18n="hero.sticker"></span></div>
        </div>
      </div>
    </section>

    <!-- ======= Marquee ======= -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>

    <!-- ======= Menu ======= -->
    <section id="menu" class="section menu-section">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-kicker" data-i18n="menu.kicker"></span>
          <h2 class="display" data-i18n="menu.title"></h2>
          <p class="section-sub" data-i18n="menu.sub"></p>
        </div>

        <div class="cat-pills" id="catPills"></div>

        <div class="menu-grid" id="menuGrid"></div>
      </div>
    </section>

    <!-- ======= About ======= -->
    <section id="about" class="section about-section">
      <div class="container about-grid">
        <div class="about-media reveal">
          <img src="assets/img/tenders.jpg" alt="GREAZ chicken tenders" loading="lazy">
        </div>
        <div class="about-text reveal">
          <span class="section-kicker" data-i18n="about.kicker"></span>
          <h2 class="display" data-i18n="about.title"></h2>
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <ul class="features">
            <li>
              <span class="f-icon">🔥</span>
              <div><b data-i18n="feat1.t"></b><span data-i18n="feat1.d"></span></div>
            </li>
            <li>
              <span class="f-icon">🥩</span>
              <div><b data-i18n="feat2.t"></b><span data-i18n="feat2.d"></span></div>
            </li>
            <li>
              <span class="f-icon">🥣</span>
              <div><b data-i18n="feat3.t"></b><span data-i18n="feat3.d"></span></div>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <!-- ======= Contact ======= -->
    <section id="contact" class="section contact-section">
      <div class="container">
        <div class="section-head reveal">
          <span class="section-kicker" data-i18n="contact.kicker"></span>
          <h2 class="display" data-i18n="contact.title"></h2>
        </div>
        <div class="contact-cards">
          <a class="contact-card reveal" id="ccAddress" target="_blank" rel="noopener">
            <span class="c-icon">📍</span>
            <b data-i18n="contact.addressLbl"></b>
            <span class="c-val" id="addressVal"></span>
          </a>
          <a class="contact-card reveal" id="ccPhone" href="tel:+96181829144">
            <span class="c-icon">📞</span>
            <b data-i18n="contact.phoneLbl"></b>
            <span class="c-val" dir="ltr">+961 81 829 144</span>
          </a>
          <div class="contact-card reveal">
            <span class="c-icon">🕒</span>
            <b data-i18n="contact.hoursLbl"></b>
            <span class="c-val" id="hoursVal"></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ======= Footer ======= -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand display">GREAZ <em>★</em></div>
      <p class="footer-tag" data-i18n="footer.tag"></p>
      <p class="footer-rights"><span data-i18n="footer.rights"></span> · <span dir="ltr">© 2026 GREAZ</span></p>
    </div>
  </footer>

  <!-- ======= Mobile cart bar ======= -->
  <button class="cart-bar" id="cartBar" hidden>
    <span class="cb-count" id="cbCount">2</span>
    <span id="cbText"></span>
    <b id="cbTotal"></b>
  </button>

  <!-- ======= Item modal ======= -->
  <div class="modal-backdrop" id="itemModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>

      <div class="modal-media" id="mMedia"></div>

      <div class="modal-body">
        <div class="modal-name-row">
          <h3 id="mName"></h3>
          <span class="modal-base-price" id="mBase"></span>
        </div>
        <p class="modal-desc" id="mDesc"></p>

        <div class="m-sec" id="mIngSec">
          <h4><span data-i18n="modal.ingredients"></span> <small data-i18n="modal.ingredientsHint"></small></h4>
          <div class="chips" id="mIng"></div>
        </div>

        <div class="m-sec" id="mChoiceSec"></div>

        <div class="m-sec" id="mExtrasSec">
          <h4 data-i18n="modal.extras"></h4>
          <div class="extras-list" id="mExtras"></div>
        </div>

        <div class="m-sec">
          <h4 data-i18n="modal.notesLbl"></h4>
          <textarea id="mNotes" rows="2" data-i18n-ph="modal.notesPh"></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <div class="m-cart-strip" id="mCartStrip" hidden></div>
        <div class="modal-footer-row">
          <div class="qty-stepper">
            <button id="mQtyMinus" aria-label="-">−</button>
            <span id="mQty">1</span>
            <button id="mQtyPlus" aria-label="+">+</button>
          </div>
          <button class="btn btn-primary btn-lg modal-add" id="mAdd"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ======= Cart drawer ======= -->
  <div class="cart-backdrop" id="cartBackdrop"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-head">
      <h3 data-i18n="cart.title"></h3>
      <div class="cart-head-actions">
        <button class="text-btn" id="clearCart" data-i18n="cart.clear"></button>
        <button class="icon-btn" id="cartClose" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
      </div>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="cart-total-row">
        <span data-i18n="cart.subtotal"></span>
        <b id="cartTotal">$0.00</b>
      </div>
      <p class="cart-pickup" id="cartPickup"></p>
      <button class="btn btn-wa btn-lg btn-block" id="checkoutBtn">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
        <span data-i18n="cart.checkout"></span>
      </button>
      <p class="cart-note" data-i18n="cart.note"></p>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
